<!DOCTYPE html>
<html>

<head>
    <title>CellVision</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #080614;
            color: #f0e6ff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-wrap { text-align: center; }

        .logo-mark {
            font-size: 52px;
            color: #7c3aed;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 3.8em;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc 0%, #7c3aed 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #9d8fc0;
            font-size: 15px;
            margin-bottom: 56px;
            letter-spacing: 0.5px;
        }

        .menu {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .card {
            background: #1a1436;
            border: 1px solid #2d2060;
            padding: 36px 40px;
            border-radius: 16px;
            text-decoration: none;
            color: #f0e6ff;
            transition: all 0.2s ease;
            width: 220px;
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.35);
            background: #211a48;
        }

        .card-icon {
            font-size: 34px;
            margin-bottom: 14px;
            color: #a78bfa;
        }

        .card h2 {
            font-size: 15px;
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 13px;
            color: #9d8fc0;
        }
    </style>
</head>

<body>
    <div class="home-wrap">
        <span class="logo-mark">◈</span>
        <h1>CellVision</h1>
        <p class="subtitle">3D Cell Phenotyping Platform</p>

        <div class="menu">
            <a href="/viewer" class="card">
                <div class="card-icon">⬡</div>
                <h2>3D Viewer</h2>
                <p>Visualize OIR files</p>
            </a>
            <a href="/segmentation" class="card">
                <div class="card-icon">⬢</div>
                <h2>Segmentation Analysis</h2>
                <p>Nucleus, Actin, Mitochondria</p>
            </a>
            <a href="/classifier" class="card">
                <div class="card-icon">⬟</div>
                <h2>Subtype Classifier</h2>
                <p>TAV-ATAA vs BAV-ATAA</p>
            </a>
        </div>
    </div>
</body>

</html>
