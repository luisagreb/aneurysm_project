<!DOCTYPE html>
<html>

<head>
    <title>Segmentation Analysis</title>
    <!-- 1. Load Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff5f8;
            color: #5e4b56;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #d65db1;
            font-size: 24px;
            font-weight: 600;
        }

        .top-controls {
            background: #ffe4e9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(214, 93, 177, 0.1);
        }

        button {
            background: #ffb7ce;
            color: #5e4b56;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #ff9eb9;
            color: white;
        }

        #run-btn {
            background: #d65db1;
            color: white;
        }

        #run-btn:hover {
            background: #b54291;
        }

        .main {
            display: flex;
            gap: 15px;
        }

        .image-area {
            flex: 1;
            background: #ffe4e9;
            border-radius: 12px;
            padding: 10px;
            min-height: 500px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel {
            width: 300px;
            background: #ffe4e9;
            border-radius: 12px;
            padding: 15px;
        }

        /* 3D Gallery */
        .gallery {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            height: 350px;
        }

        .gallery-item {
            flex: 1;
            background: linear-gradient(135deg, #b8c6db 0%, #f5f7fa 100%);
            /* Slicer-ish Blue/Grey */
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid #ffb7ce;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .gallery-item h3 {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            pointer-events: none;
            z-index: 10;
        }

        #status-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #d65db1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Segmentation Analysis (3D)</h1>
        <p><a href="/" style="color: #d65db1; text-decoration: none;">&larr; Back to Home</a></p>

        <div class="top-controls">
            <input type="file" id="file-input" accept=".oir">
            <button onclick="loadFile()">Load OIR</button>
            <button id="run-btn" onclick="runSegmentation()">Run Segmentation</button>

            <div style="flex:1"></div> <!-- Spacer -->
            <span>Slice: <b id="slice-val">0/0</b></span>
        </div>

        <!-- Main 2D Viewer -->
        <div class="main">
            <div class="image-area">
                <div id="status-container">
                    <div class="spinner"></div>
                    <div id="status-text">Processing...</div>
                </div>
                <canvas id="canvas"></canvas>
            </div>

            <div class="panel">
                <h3 style="color:#d65db1; margin-bottom:10px;">Controls</h3>
                <button onclick="prevSlice()" style="width:40px">&lt;</button>
                <button onclick="nextSlice()" style="width:40px">&gt;</button>
                <input type="range" id="slice-slider" style="width:100%; margin-top:10px;"
                    oninput="setSlice(this.value)">
                <p style="margin-top:20px; font-size:13px; color:#666">
                    1. Load an OIR file.<br>
                    2. Click "Run Segmentation".<br>
                    3. Wait for AI.<br>
                    4. See 3D models below.
                </p>
            </div>
        </div>

        <!-- 3D Viewers -->
        <div class="gallery">
            <div class="gallery-item" id="view-0">
                <h3>Nucleus</h3>
            </div>
            <div class="gallery-item" id="view-1">
                <h3>Actin</h3>
            </div>
            <div class="gallery-item" id="view-2">
                <h3>Mitochondria</h3>
            </div>
        </div>
    </div>

    <script>
        // Global State
        let totalSlices = 0, currentSlice = 0;
        let viewers = {}; // {0: {scene, camera, renderer, ...}}

        // Colors for the 3D models
        const COLORS = {
            0: 0x4488ff, // Blue (Nucleus)
            1: 0x44ff88, // Green (Actin)
            2: 0xff4444  // Red (Mito)
        };

        // 1. Initialize 3D Scenes immediately
        function initAll3D() {
            [0, 1, 2].forEach(id => {
                const container = document.getElementById(`view-${id}`);
                const w = container.clientWidth;
                const h = container.clientHeight;

                // Scene
                const scene = new THREE.Scene();
                // Slicer-like background color
                scene.background = new THREE.Color(0xb0c4de);

                // Camera
                const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 2000);
                camera.position.set(0, -200, 200); // Start looking from an angle

                // Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(w, h);
                container.appendChild(renderer.domElement);

                // Controls
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;

                // Lighting (Permanent)
                const amb = new THREE.AmbientLight(0x606060);
                scene.add(amb);
                const dir = new THREE.DirectionalLight(0xffffff, 0.9);
                dir.position.set(100, 100, 100);
                scene.add(dir);
                const dir2 = new THREE.DirectionalLight(0xffffff, 0.5);
                dir2.position.set(-100, -50, -100); // Backlight
                scene.add(dir2);

                viewers[id] = { scene, camera, renderer, controls };

                // Start Loop
                animate(id);
            });
        }

        function animate(id) {
            requestAnimationFrame(() => animate(id));
            viewers[id].controls.update();
            viewers[id].renderer.render(viewers[id].scene, viewers[id].camera);
        }

        // 2. Load File Logic
        async function loadFile() {
            const f = document.getElementById('file-input').files[0];
            if (!f) return alert("Select File");

            showStatus("Loading...");
            const fd = new FormData(); fd.append('file', f);

            try {
                const res = await fetch('/load', { method: 'POST', body: fd });
                const data = await res.json();
                totalSlices = data.slices;
                currentSlice = Math.floor(totalSlices / 2);
                document.getElementById('slice-slider').max = totalSlices - 1;
                update2D();
            } catch (e) { alert(e); }
            hideStatus();
        }

        // 3. Run Segmentation
        async function runSegmentation() {
            if (totalSlices === 0) return alert("Load file first");

            showStatus("Running AI (This takes time)...");
            try {
                const res = await fetch('/run_segmentation', { method: 'POST' });
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                // Update 2D (to show overlays)
                update2D();

                // Update 3D Models
                await loadMesh(0);
                await loadMesh(1);
                await loadMesh(2);

                alert("Segmentation Complete!");

            } catch (e) { alert("Error: " + e.message); }
            hideStatus();
        }

        // 4. Load 3D Mesh
        async function loadMesh(id) {
            try {
                const res = await fetch(`/mesh/${id}`);
                const data = await res.json();

                if (data.error) { console.log(`No mesh for ${id}`); return; }

                const v = viewers[id];

                // Clear OLD MESH only (keep lights)
                // We know lights are types AmbientLight/DirectionalLight. Mesh is 'Mesh'.
                const toRemove = [];
                v.scene.traverse(child => {
                    if (child.isMesh) toRemove.push(child);
                });
                toRemove.forEach(child => v.scene.remove(child));

                // Create Geometry
                const geometry = new THREE.BufferGeometry();
                const vertices = new Float32Array(data.vertices.flat());
                const indices = data.faces.flat();

                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();
                geometry.center(); // Center the model at (0,0,0)

                // Material
                const material = new THREE.MeshPhongMaterial({
                    color: COLORS[id],
                    specular: 0x111111,
                    shininess: 50,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(geometry, material);
                v.scene.add(mesh);

                // Auto-Fit Camera?
                // Let's just reset camera to a good distance
                v.camera.position.set(0, -200, 100);
                v.camera.lookAt(0, 0, 0);

            } catch (e) { console.error(e); }
        }

        // 5. 2D Logic
        async function update2D() {
            document.getElementById('slice-val').textContent = `${currentSlice}/${totalSlices}`;
            const cvs = document.getElementById('canvas');
            // Using Ch 0 for now
            const res = await fetch(`/slice/0/${currentSlice}`);
            const data = await res.json();
            const img = new Image();
            img.onload = () => { cvs.width = img.width; cvs.height = img.height; cvs.getContext('2d').drawImage(img, 0, 0); };
            img.src = 'data:image/png;base64,' + data.image;
        }
        function setSlice(v) { currentSlice = parseInt(v); update2D(); }
        function nextSlice() { if (currentSlice < totalSlices - 1) setSlice(currentSlice + 1); }
        function prevSlice() { if (currentSlice > 0) setSlice(currentSlice - 1); }

        function showStatus(msg) {
            document.getElementById('status-container').style.display = 'block';
            document.getElementById('status-text').textContent = msg;
        }
        function hideStatus() { document.getElementById('status-container').style.display = 'none'; }

        // Init
        initAll3D();

        // Resize Handle
        window.addEventListener('resize', () => {
            [0, 1, 2].forEach(id => {
                const box = document.getElementById(`view-${id}`);
                if (viewers[id]) {
                    viewers[id].renderer.setSize(box.clientWidth, box.clientHeight);
                    viewers[id].camera.aspect = box.clientWidth / box.clientHeight;
                    viewers[id].camera.updateProjectionMatrix();
                }
            });
        });

    </script>
</body>

</html>
